
<svg width="600" height="1800" viewBox="0 0 600 1800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Mask that cuts out the 4 photo windows -->
    <mask id="photoCutoutMask">
      <!-- White everywhere (keep) -->
      <rect width="600" height="1800" fill="white" />
      <!-- Black at the 4 photo slots (makes them transparent) -->
      <rect x="45" y="295" width="510" height="320" rx="32" ry="32" fill="black" />
      <rect x="45" y="660" width="510" height="320" rx="32" ry="32" fill="black" />
      <rect x="45" y="1025" width="510" height="320" rx="32" ry="32" fill="black" />
      <rect x="45" y="1390" width="510" height="320" rx="32" ry="32" fill="black" />
    </mask>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background with Cutout Mask -->
  <g mask="url(#photoCutoutMask)">
    <!-- Base Warm Cream -->
    <rect width="600" height="1800" fill="#F7F4EB" />

    <!-- Organic Pastel Shapes -->
    <!-- Top-left avocado blob -->
    <path d="M-40 -40 Q 220 -20 180 180 T -40 320 Z" fill="#E2E9CB" opacity="0.85" />
    <!-- Top-right matcha blob -->
    <path d="M 420 -30 Q 640 -10 630 220 T 450 360 Z" fill="#D7E2B8" opacity="0.75" />
    <!-- Mid right blob -->
    <path d="M 640 700 Q 460 850 640 1050 Z" fill="#E4EACF" opacity="0.8" />
    <!-- Bottom left blob -->
    <path d="M -30 1100 Q 180 1280 20 1520 T -30 1830 Z" fill="#DDE6C2" opacity="0.85" />
    <!-- Bottom right diagonal warm wedge -->
    <path d="M 400 1830 L 630 1500 L 630 1830 Z" fill="#E7ECDA" opacity="0.9" />
  </g>

  <!-- Frame Decorations (Drawn on TOP of photos & background) -->
  <g id="decorations">
    <!-- Top Pill Badge -->
    <g transform="translate(185, 60)">
      <rect x="0" y="0" width="230" height="44" rx="22" fill="#FBF9F4" stroke="#5C4733" stroke-width="2.5" />
      <text x="115" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#5C4733" text-anchor="middle" letter-spacing="0.5">@reallygreatsite</text>
    </g>

    <!-- 'happy with you' Heading -->
    <text x="300" y="185" font-family="'Comfortaa', 'Fredoka', cursive, sans-serif" font-weight="900" font-size="52" fill="#56412D" text-anchor="middle" letter-spacing="-1">happy with you</text>

    <!-- Top-Left Line Art Leaves -->
    <g stroke="#5C4733" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(10, 80) scale(1.1)">
      <path d="M 0 120 C 20 90, 50 60, 80 40" />
      <path d="M 30 95 C 20 80, 25 65, 45 70 C 55 75, 45 90, 30 95" />
      <path d="M 55 70 C 50 50, 65 40, 85 50 C 90 65, 75 75, 55 70" />
      <path d="M 80 40 C 85 20, 110 25, 115 45 C 105 60, 90 55, 80 40" />
    </g>

    <!-- Top-Right Line Art Leaves -->
    <g stroke="#5C4733" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(480, 80) scale(1.1)">
      <path d="M 100 120 C 80 90, 50 60, 20 40" />
      <path d="M 70 95 C 80 80, 75 65, 55 70 C 45 75, 55 90, 70 95" />
      <path d="M 45 70 C 50 50, 35 40, 15 50 C 10 65, 25 75, 45 70" />
      <path d="M 20 40 C 15 20, -10 25, -15 45 C -5 60, 10 55, 20 40" />
    </g>

    <!-- Gap 1 & 2 Right Star ✦ -->
    <g transform="translate(525, 630)">
      <!-- 4 Point Sparkle Star -->
      <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#8B735B" />
      <circle cx="-18" cy="-14" r="3" fill="#8B735B" />
      <circle cx="22" cy="-18" r="2.5" fill="#8B735B" />
    </g>

    <!-- Gap 2 & 3 Left Palm Branch / Fern (overlapping slot 2 bottom & slot 3 top) -->
    <g fill="#83705C" opacity="0.95" transform="translate(0, 890) rotate(15) scale(1.2)">
      <path d="M 0 150 C 20 100, 50 50, 90 0 C 85 20, 70 60, 45 110 C 25 150, 10 180, 0 210 Z" />
      <!-- Leaflets -->
      <path d="M 10 160 C 25 150, 50 140, 75 145 C 55 160, 35 170, 10 175 Z" />
      <path d="M 20 130 C 40 115, 70 105, 95 115 C 70 130, 45 140, 20 145 Z" />
      <path d="M 32 100 C 55 80, 85 70, 110 82 C 85 100, 58 110, 32 115 Z" />
      <path d="M 45 70 C 70 50, 98 40, 120 52 C 95 70, 68 80, 45 85 Z" />
      <path d="M 60 40 C 80 20, 108 10, 128 22 C 105 40, 80 50, 60 55 Z" />
      <path d="M 75 15 C 92 -5, 115 -12, 130 0 C 110 18, 90 28, 75 30 Z" />
    </g>

    <!-- Gap 3 & 4 Left Sparkle Star ✦ -->
    <g transform="translate(55, 1350)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#8B735B" />
      <circle cx="-14" cy="14" r="2.5" fill="#8B735B" />
      <circle cx="16" cy="-14" r="2" fill="#8B735B" />
    </g>

    <!-- Bottom-Right Fern Branch (overlapping slot 4) -->
    <g fill="#7A6753" opacity="0.95" transform="translate(480, 1370) rotate(-15) scale(1.3)">
      <path d="M 40 220 C 30 160, 20 100, 0 40 C 15 60, 25 100, 35 150 C 45 190, 50 220, 55 250 Z" />
      <path d="M 35 200 C 15 190, -15 180, -40 185 C -20 200, 5 210, 35 215 Z" />
      <path d="M 30 165 C 5 150, -30 140, -55 148 C -30 165, 0 175, 30 180 Z" />
      <path d="M 22 130 C -5 110, -40 100, -68 110 C -40 130, -10 140, 22 145 Z" />
      <path d="M 15 95 C -15 75, -48 65, -75 78 C -48 95, -20 105, 15 110 Z" />
      <path d="M 8 60 C -18 40, -45 30, -70 42 C -45 60, -20 70, 8 75 Z" />
      <path d="M 0 30 C -20 10, -42 0, -65 12 C -42 30, -20 40, 0 45 Z" />
    </g>
  </g>
</svg>
